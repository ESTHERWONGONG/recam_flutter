name: recam_flutter
description: ReCam - AI powered analog camera.
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- UI 图标库 ---
  cupertino_icons: ^1.0.8

  # --- 你的核心 Swift 插件 ---
  recam_native_camera:
    path: recam_native_camera

  # --- 本地存储 ---
  shared_preferences: ^2.2.2

  # --- 时间格式化 ---
  intl: ^0.19.0

  # --- 权限管理 ---
  permission_handler: ^11.0.1

  # --- 外部跳转 ---
  url_launcher: ^6.2.4

  # --- 获取版本号 ---
  package_info_plus: ^5.0.1

  # --- 备用相机库 ---
  camera: ^0.10.5

  # --- 截图库 (保存编辑效果) ---
  screenshot: ^3.0.0

  # --- 路径库 ---
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # ✅✅✅ [关键修复] 必须在这里注册资源文件夹！✅✅✅
  # 注意缩进：assets 前面有 2 个空格，横线 - 前面有 4 个空格
  assets:
    - assets/frames/
    - assets/stickers/
    - assets/textures/