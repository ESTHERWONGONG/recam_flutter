name: recam_flutter
description: ReCam - AI powered analog camera.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- UI 图标库 ---
  cupertino_icons: ^1.0.8

  # --- 你的核心 Swift 插件 ---
  recam_native_camera:
    path: recam_native_camera

  # --- 本地存储 ---
  shared_preferences: ^2.2.2

  # --- 时间格式化 ---
  intl: ^0.19.0

  # --- 权限管理 ---
  permission_handler: ^11.0.1

  # --- 外部跳转 ---
  url_launcher: ^6.2.4

  # --- 获取版本号 ---
  package_info_plus: ^5.0.1

  # --- 备用相机库 (部分底层依赖) ---
  camera: ^0.10.5

  # --- 截图库 (保存编辑效果) ---
  screenshot: ^3.0.0

  # --- 路径库 ---
  path_provider: ^2.1.1

  # ✅ 手势矩阵库 (用于贴纸拖拽/缩放/旋转)
  # 之前写成 ^0.2.0，pub 上没有这个正式版，会报错
  matrix_gesture_detector: ^0.2.0-nullsafety.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # ✅ 资源路径注册
  assets:
    - assets/frames/
    - assets/stickers/
    - assets/textures/
